[package]
name = "talax-correct"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TalaX correction pipeline as a JSON-lines sidecar for host dictation daemons (ptdictd)"

[[bin]]
name = "talax-correct"
path = "src/main.rs"

[dependencies]
talax-engine = { path = "../talax-engine", version = "1.14.0", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
rusqlite = { workspace = true }
