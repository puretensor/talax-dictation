[package]
name = "talax-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ureq = "3"
cpal = "0.18"
whisper-rs = "0.16"
rdev = "0.5"
arboard = "3"
enigo = { version = "0.6", features = ["serde"] }
sha2 = "0.10"
# Not used directly. Floor on the Enigo/XKB graph: PRs #50/#51 patched
# Cargo.lock to memmap2 0.9.11 (RUSTSEC-2026-0186); later lock
# regenerations silently fell back to 0.9.10. A floor survives
# regeneration; a bare lock entry does not.
memmap2 = "0.9.11"

[dev-dependencies]
tempfile = "3"
