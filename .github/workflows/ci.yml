name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine-app-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxtst-dev \
            pkg-config \
            xvfb \
            xclip
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Install Rust audit tools
        run: cargo install --locked cargo-audit cargo-deny
      - name: Rust dependency audit
        run: cargo audit
      - name: Rust dependency policy
        run: cargo deny check advisories bans sources
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Engine without runtime features
        run: cargo test -p talax-engine --no-default-features
      - name: Sidecar release build
        run: cargo build --release -p talax-correct
      - name: Sidecar runtime-dependency gate
        run: |
          if cargo tree -p talax-correct -e normal | grep -E 'whisper-rs|cpal|rdev|enigo|arboard'; then
            echo "talax-correct must not depend on whisper-rs, cpal, rdev, enigo, or arboard"
            exit 1
          fi
      - name: Clipboard ownership on isolated X11
        run: env -u WAYLAND_DISPLAY xvfb-run -a cargo test -p talax-engine --test clipboard_x11 -- --ignored
      - name: Frontend dependencies
        working-directory: ui
        run: npm ci
      - name: Frontend dependency audit
        working-directory: ui
        run: npm audit --audit-level=high
      - name: Frontend type check
        working-directory: ui
        run: npm run check
      - name: Frontend unit tests
        working-directory: ui
        run: npm test
      - name: Frontend build
        working-directory: ui
        run: npm run build
